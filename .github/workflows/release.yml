name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify release (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}

      - name: Verify archive and search tools
        run: |
          if ! tar --version | head -n 1 | grep -q "GNU tar"; then
            echo "::error::GNU tar is required for archive extraction"
            exit 1
          fi
          if ! command -v rg > /dev/null; then
            echo "::notice::ripgrep missing; installing in this runner"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          rg --version | head -n 1

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/release-guards.mjs tag "$TAG_NAME"

      - name: Verify tag commit is reachable from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/release-guards.mjs ancestry \
            "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate packaged files
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node scripts/check-pack-contents.mjs "$RUNNER_TEMP/pack.json"

      - name: Pack release artifact
        if: matrix.node == '24'
        run: |
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS

      - name: Upload release artifact
        if: matrix.node == '24'
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-package
          path: |
            *.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-package
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" ./*.tgz ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --verify-tag \
            --generate-notes
