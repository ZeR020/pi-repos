name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify archive and search tools
        run: |
          if ! tar --version | head -n 1 | grep -q "GNU tar"; then
            echo "::error::GNU tar is required for archive extraction"
            exit 1
          fi
          if ! command -v rg > /dev/null; then
            echo "::notice::ripgrep missing; installing in this runner"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          rg --version | head -n 1
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must look like v1.2.3"; exit 1 ;;
          esac
          package_version="$(node -p "require('./package.json').version")"
          if [ "v$package_version" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME != package version $package_version"
            exit 1
          fi

      - name: Verify tag commit is reachable from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" \
            refs/remotes/origin/main; then
            echo "::error::Tag commit is not reachable from main"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and test
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Pack release artifact
        run: |
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            *.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" ./*.tgz ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --verify-tag \
            --generate-notes
